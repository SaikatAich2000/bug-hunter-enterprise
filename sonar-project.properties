# =============================================================================
#  SonarQube project configuration for Bug Hunter
# -----------------------------------------------------------------------------
#  Read by `sonar-scanner` (CLI) or `sonar-scanner-cli` (Docker image) from the
#  repo root. It does NOT need a SONAR_TOKEN baked in — pass it on the CLI:
#
#      sonar-scanner \
#        -Dsonar.host.url=http://localhost:9000 \
#        -Dsonar.login=$SONAR_TOKEN
#
#  Or use the bundled helper which also runs pytest with coverage:
#
#      ./scripts/sonar-scan.sh
#
#  Nothing in this file touches the database, the bugtracker_pgdata
#  volume, or any runtime state — SonarQube is purely a static-analysis
#  tool that reads source files.
# =============================================================================

# --- Project identity -------------------------------------------------------
# Keep this stable across analyses so SonarQube can show issue-trend graphs.
sonar.projectKey=Bug-Hunter-Enterprise
sonar.projectName=Bug Hunter Enterprise
sonar.projectVersion=2.10

# --- Sources & tests --------------------------------------------------------
# `sonar.sources` lists directories scanned as "production code"; tests are
# listed separately so SonarQube applies test-specific rules (and doesn't
# count test code in the duplication / complexity metrics for prod).
sonar.sources=app
sonar.tests=tests

# Default UTF-8 — the SPA emits UTF-8 HTML; the backend reads UTF-8.
sonar.sourceEncoding=UTF-8

# --- Language settings ------------------------------------------------------
# Python: tell SonarPython which version to lint against. 3.12 is the
# version pinned in the Dockerfile.
sonar.python.version=3.12

# JavaScript: the SPA is plain (no module bundler), so no node_modules
# to scan. SonarJS still lints app/static/*.js.

# --- Coverage --------------------------------------------------------------
# Generated by `pytest --cov` (see requirements-dev.txt + scripts/sonar-scan.sh).
# Path is relative to the project root.
sonar.python.coverage.reportPaths=coverage.xml

# `sonar.coverage.exclusions` decides which files count toward the
# Coverage% denominator. Pytest only measures the Python backend, so
# adding JS / HTML / CSS files to the denominator would (wrongly)
# crater the displayed Coverage% number. Strip them out — they're
# still SCANNED for code quality, just not graded for "is this
# unit-tested" coverage.
sonar.coverage.exclusions=\
  app/static/**,\
  **/*.js,\
  **/*.ts,\
  **/*.html,\
  **/*.css,\
  **/*.svg,\
  Dockerfile,\
  docker-compose.yml,\
  deploy.sh,\
  down.sh,\
  scripts/**,\
  tests/**,\
  app/__init__.py,\
  app/routes/__init__.py,\
  app/chatbot/__init__.py

# --- Test execution report (optional) ---------------------------------------
# If you generate one with `pytest --junitxml=junit.xml`, SonarQube will
# render the test list under the Measures > Tests pane. The helper script
# generates this too.
sonar.python.xunit.reportPath=junit.xml

# --- Inclusion / exclusion rules -------------------------------------------
# Things to scan:
#   * app/             — Python backend, JS SPA, HTML, CSS
#   * tests/           — pytest test files
# Things to skip (cruft that would pollute metrics):
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/node_modules/**,\
  **/.venv/**,\
  **/venv/**,\
  **/.pytest_cache/**,\
  **/.mypy_cache/**,\
  **/.ruff_cache/**,\
  **/dist/**,\
  **/build/**,\
  **/models/**,\
  **/.playwright-mcp/**,\
  **/htmlcov/**,\
  coverage.xml,\
  junit.xml,\
  app/static/favicon.png,\
  app/static/icon.png,\
  **/*.min.js,\
  **/*.min.css

# Don't apply test-specific rules to source files; don't apply source rules
# to test files. The separation keeps "Code smells in tests" out of the prod
# code quality gate.
sonar.test.inclusions=tests/**/*.py
sonar.test.exclusions=app/**

# Files copied INTO the image at build time aren't useful to scan twice —
# we skip the Dockerfile-mirrored paths. (Dockerfile itself IS scanned by
# the IaC analyzer.)

# --- Duplication threshold --------------------------------------------------
# Default is 100 lines; raise to 200 so straightforward repetitive route
# handlers (which are intentionally similar across CRUD shapes) don't get
# flagged. Tune to taste.
sonar.cpd.python.minimumLines=200
sonar.cpd.javascript.minimumLines=120

# --- Issue suppressions -----------------------------------------------------
# Frontend bundle is large — the contenteditable editor and the staged-files
# helpers genuinely need to share state across a lot of functions. Leave
# complexity warnings on so they're visible, but raise the function-size
# threshold a touch so they're not noise.
# (Use the in-source `// NOSONAR` pragma for one-off suppressions when an
# issue is intentional.)

# Block-suppression: the v2.6 rich-text editor in app/static/app.js uses
# execCommand, window.getSelection, and several intentionally-complex
# selection/wrapping helpers that are load-bearing for the contenteditable
# bug-modal description field. Sonar's modernization warnings would direct
# us to refactor this code; documented in CHANGES.md as DO NOT MODIFY.
# The SONAR_RT_BEGIN / SONAR_RT_END comment markers delimit the block.
sonar.issue.ignore.block=rtblock,csrfcookie
sonar.issue.ignore.block.rtblock.beginBlockRegexp=SONAR_RT_BEGIN
sonar.issue.ignore.block.rtblock.endBlockRegexp=SONAR_RT_END

# Block-suppression: the CSRF double-submit cookie in app/csrf.py issues a
# cookie WITHOUT HttpOnly (httponly=False) — Sonar flags this as a Security
# Hotspot, but it is LOAD-BEARING here. The SPA fetch wrapper has to read
# the cookie value to populate the X-CSRF-Token header on every state-
# changing request; flipping HttpOnly=True would silently break CSRF
# protection. Safety relies on Same-Origin Policy + SameSite=Lax + the
# header/cookie compare_digest check in CSRFMiddleware (see csrf.py
# module docstring + the issue_csrf_cookie docstring for the full
# threat-model writeup). The SONAR_CSRF_BEGIN / SONAR_CSRF_END comment
# markers delimit the block.
sonar.issue.ignore.block.csrfcookie.beginBlockRegexp=SONAR_CSRF_BEGIN
sonar.issue.ignore.block.csrfcookie.endBlockRegexp=SONAR_CSRF_END

# list_bugs in app/routes/bugs.py exposes 14 URL query params — each
# multi-select filter the SPA passes through. Bundling them into a Pydantic
# dependency class breaks under `from __future__ import annotations`
# (FastAPI dependency-class introspection can't resolve forward refs). The
# inline NOSONAR isn't honored by SonarPython for S107, so suppress at
# project level.
sonar.issue.ignore.multicriteria=py-s107-listbugs,py-s5717-fastapi-depends,py-s5717-fastapi-depends-totp,py-s8410-annotated,py-s8415-exc-docs,py-s8409-response-model
sonar.issue.ignore.multicriteria.py-s107-listbugs.ruleKey=python:S107
sonar.issue.ignore.multicriteria.py-s107-listbugs.resourceKey=app/routes/bugs.py

# Depends(get_current_user) is FastAPI's request-time sentinel, not a
# mutable shared default. SonarPython doesn't recognize the dependency-
# injection idiom and flags S5717 on Depends-defaulted params. Auth router
# only — the rest of the routes are flagged but only one was reported in
# the export so we suppress narrowly.
sonar.issue.ignore.multicriteria.py-s5717-fastapi-depends.ruleKey=python:S5717
sonar.issue.ignore.multicriteria.py-s5717-fastapi-depends.resourceKey=app/routes/auth.py

# Same false positive as above for the TOTP (2FA) router — Depends() is
# a FastAPI sentinel, not a mutable default. Suppress S5717 on totp.py.
sonar.issue.ignore.multicriteria.py-s5717-fastapi-depends-totp.ruleKey=python:S5717
sonar.issue.ignore.multicriteria.py-s5717-fastapi-depends-totp.resourceKey=app/routes/totp.py

# --- Opinionated FastAPI style rules (S84xx), suppressed app-wide -----------
# These newer SonarPython rules are stylistic/documentation preferences, not
# correctness or security issues, and this project deliberately uses the
# flagged idioms consistently across every endpoint (app/routes/*, the handful
# of endpoints in app/main.py, and app/chatbot/router.py). Rewriting all ~190
# handlers to satisfy them would be a large, regression-prone change for no
# behavioural gain, so they are suppressed app-wide with this justification
# (mirrors the sibling Bug-Hunter repo's identical, documented decision):
#   S8410 — "use Annotated for dependency injection". The `param: T =
#     Depends(...)` form is FastAPI's canonical, documented style and is used
#     uniformly across the app; Annotated is a preference, not a requirement.
#   S8415 — "document this HTTPException in the responses= parameter". The API
#     is internal and self-describing; per-endpoint OpenAPI response docs add
#     verbosity without value for this app.
#   S8409 — "redundant response_model duplicates the return annotation".
#     Keeping the explicit response_model is intentional for readability and to
#     pin the serialization contract independently of the handler's annotation.
sonar.issue.ignore.multicriteria.py-s8410-annotated.ruleKey=python:S8410
sonar.issue.ignore.multicriteria.py-s8410-annotated.resourceKey=app/**/*.py
sonar.issue.ignore.multicriteria.py-s8415-exc-docs.ruleKey=python:S8415
sonar.issue.ignore.multicriteria.py-s8415-exc-docs.resourceKey=app/**/*.py
sonar.issue.ignore.multicriteria.py-s8409-response-model.ruleKey=python:S8409
sonar.issue.ignore.multicriteria.py-s8409-response-model.resourceKey=app/**/*.py

# --- SCM (Git) integration --------------------------------------------------
# Lets SonarQube attribute new issues to the commit / author that introduced
# them, and show file-level "blame" timestamps in the UI.
sonar.scm.provider=git
sonar.scm.exclusions.disabled=false

# --- Quality-gate wait (CI tip, not enforced here) --------------------------
# When wiring this into CI, add `-Dsonar.qualitygate.wait=true` so the build
# fails if the gate doesn't pass. Local scans skip the wait — you can browse
# results in the SonarQube UI right after the scanner exits.
