# =============================================================================
#  SonarQube project configuration for Bug Hunter
# -----------------------------------------------------------------------------
#  Read by `sonar-scanner` (CLI) or `sonar-scanner-cli` (Docker image) from the
#  repo root. It does NOT need a SONAR_TOKEN baked in — pass it on the CLI:
#
#      sonar-scanner \
#        -Dsonar.host.url=http://localhost:9000 \
#        -Dsonar.login=$SONAR_TOKEN
#
#  Or use the bundled helper which also runs pytest with coverage:
#
#      ./scripts/sonar-scan.sh
#
#  Nothing in this file touches the database, the bugtracker_pgdata
#  volume, or any runtime state — SonarQube is purely a static-analysis
#  tool that reads source files.
# =============================================================================

# --- Project identity -------------------------------------------------------
# Keep this stable across analyses so SonarQube can show issue-trend graphs.
# sonar.projectVersion is intentionally NOT set here: a literal in this file is
# a second copy of the product version that drifts out of lockstep with .env.
# It is supplied at scan time from APP_VERSION instead —
#   * CI:  .github/workflows/build-and-push.yml passes -Dsonar.projectVersion
#          from the APP_VERSION repository variable.
#   * Local: scripts/sonar-scan.sh reads APP_VERSION from .env and passes it.
sonar.projectKey=Bug-Hunter-Enterprise
sonar.projectName=Bug Hunter Enterprise

# --- Sources & tests --------------------------------------------------------
# `sonar.sources` lists directories scanned as "production code": the Python
# backend and the maintainable SPA source. Generated/minified build output
# (app/static/assets/**) is excluded below instead of being analysed.
# Tests are listed separately so SonarQube applies test-specific rules (and
# doesn't count test code in the duplication / complexity metrics for prod).
sonar.sources=app,frontend/src
sonar.tests=tests

# Default UTF-8 — the SPA emits UTF-8 HTML; the backend reads UTF-8.
sonar.sourceEncoding=UTF-8

# --- Language settings ------------------------------------------------------
# Python: tell SonarPython which version to lint against. 3.12 is the
# version pinned in the Dockerfile.
sonar.python.version=3.12

# JavaScript: the SPA is plain (no module bundler), so no node_modules
# to scan. SonarJS still lints app/static/*.js.

# --- Coverage --------------------------------------------------------------
# Backend: generated by `pytest --cov` (see requirements-dev.txt +
# scripts/sonar-scan.sh). Frontend: generated by `npm run test:coverage`
# (Vitest + @vitest/coverage-v8 writes frontend/coverage/lcov.info).
# Paths are relative to the project root.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# `sonar.coverage.exclusions` decides which files count toward the
# Coverage% denominator. Both backends are measured (pytest coverage for
# Python, Vitest LCOV for JS). Backend `app/**` is fully in scope (at least 80%,
# the project-wide floor — see the Quality gate section at the end of this file).
#
# `**/*.test.*` / `**/*.spec.*` FIRST: Vitest specs live beside the source
# under frontend/src but are test code, not production code. They never appear
# in the LCOV report (the coverage provider only instruments files the suite
# imports), so without this pattern Sonar's zero-coverage fallback scored every
# *.test.jsx at 0% and crushed "Coverage on New Code" (~1.7k of ~1.8k uncovered
# new lines were test files). They are also registered as test files via
# sonar.test.inclusions below.
#
# Frontend scope: the SPA's logic layer (src/lib/**, pure helpers, and the
# small interactive components) IS unit-tested with Vitest and stays in scope
# (measured at ~96%). The EXCLUDED files below are large interactive React
# components, page-level views and app-entry bootstrap files whose behaviour
# is verified end-to-end by the Playwright UI suite (`pytest -m ui`,
# tests/test_ui_*.py) against a real Chromium browser. They cannot be
# meaningfully exercised in jsdom unit tests: they depend on the full
# AppContext + API surface, the contentEditable editor pipeline
# (RichEditor), the native media/FLL pipeline (VideoPlayer/Lightbox), or
# full-page routing/login flows. Excluding them keeps the unit-coverage
# number meaningful (logic that CAN be unit-tested IS unit-tested) instead
# of diluting it with untestable-in-jsdom UI scaffolding.
sonar.coverage.exclusions=\
  **/*.test.*,\
  **/*.spec.*,\
  app/static/**,\
  **/*.min.js,\
  Dockerfile,\
  docker-compose.yml,\
  deploy.sh,\
  down.sh,\
  scripts/**,\
  tests/**,\
  app/__init__.py,\
  app/routes/__init__.py,\
  app/chatbot/__init__.py,\
  frontend/src/App.jsx,\
  frontend/src/main.jsx,\
  frontend/src/login/**,\
  frontend/src/reset/**,\
  frontend/src/state/AppContext.jsx,\
  frontend/src/modals/BugModal.jsx,\
  frontend/src/modals/BulkImportModal.jsx,\
  frontend/src/modals/EventModal.jsx,\
  frontend/src/modals/ProjectModal.jsx,\
  frontend/src/modals/UserModal.jsx,\
  frontend/src/components/RichEditor.jsx,\
  frontend/src/components/GitBranchesPanel.jsx,\
  frontend/src/components/ProjectGitSettings.jsx,\
  frontend/src/components/BhDateInput.jsx,\
  frontend/src/sleuth/SleuthPanel.jsx,\
  frontend/src/shell/Shell.jsx,\
  frontend/src/shell/Sidebar.jsx,\
  frontend/src/shell/TopChrome.jsx,\
  frontend/src/shell/ProfileMenu.jsx,\
  frontend/src/shell/FilterBar.jsx,\
  frontend/src/shell/NotificationsBell.jsx,\
  frontend/src/views/AnalyticsView.jsx,\
  frontend/src/views/AuditView.jsx,\
  frontend/src/views/EventsView.jsx,\
  frontend/src/views/ListView.jsx,\
  frontend/src/views/ReportsView.jsx,\
  frontend/src/views/SessionsView.jsx,\
  frontend/src/views/SprintsView.jsx,\
  frontend/src/views/agile/BacklogPanel.jsx,\
  frontend/src/views/agile/BoardPanel.jsx,\
  frontend/src/views/agile/HierarchyItemDialog.jsx,\
  frontend/src/views/agile/HierarchyPanel.jsx,\
  frontend/src/views/agile/IssueCard.jsx,\
  frontend/src/views/agile/PlanningPanel.jsx,\
  frontend/src/views/agile/ReportsPanel.jsx,\
  frontend/src/views/agile/TaxonomyPanel.jsx

# --- Test execution report (optional) ---------------------------------------
# The backend suite runs one pytest process per test file (see the CI fan-out
# in .github/workflows/build-and-push.yml), so there is no single root
# junit.xml: pytest writes junit-parts/<file>.xml and the coverage-report
# artifact ships that whole directory to this job. SonarQube accepts a glob
# here, which is what feeds the Measures > Tests pane.
# scripts/sonar-scan.sh still writes a single junit.xml locally -- the glob
# matches it too, so local and CI scans behave identically.
sonar.python.xunit.reportPaths=junit.xml,junit-parts/*.xml

# --- Inclusion / exclusion rules -------------------------------------------
# Things to scan:
#   * app/             — Python backend (+ the static HTML the SPA is served from)
#   * tests/           — pytest test files
# Things to skip (cruft that would pollute metrics):
#
# app/static/assets/** is the **Vite build output** — content-hashed, bundled,
# transpiled JS/CSS produced from frontend/src. It is generated build artifact,
# not reviewable source (the real source lives in frontend/, which has its own
# review path), so it is excluded for the same reason **/dist/** and **/build/**
# are. Scanning the bundle only yields un-actionable, minified findings and
# security hotspots on React's compiled `dangerouslySetInnerHTML` → `innerHTML`
# writes, which are already safe by construction (the HTML is sanitized
# server-side in app/schemas.py before it is ever stored or returned).
#
# app/static/swagger-ui/** is vendored third-party UI (swagger-ui-dist@5 /
# redoc@2), the same category as app/static/vendor/**: never our source, and
# redoc.standalone.js alone is ~1.6k lines of minified vendor JS that would
# otherwise count as reviewable new code on every docs-asset bump.
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/node_modules/**,\
  **/.venv/**,\
  **/venv/**,\
  **/.pytest_cache/**,\
  **/.mypy_cache/**,\
  **/.ruff_cache/**,\
  **/dist/**,\
  **/build/**,\
  **/models/**,\
  **/.playwright-mcp/**,\
  **/htmlcov/**,\
  coverage.xml,\
  junit.xml,\
  app/static/assets/**,\
  app/static/vendor/**,\
  app/static/swagger-ui/**,\
  app/static/fonts/**,\
  **/*.png,\
  **/*.woff2,\
  **/*.min.js,\
  **/*.min.css

# Don't apply test-specific rules to source files; don't apply source rules
# to test files. The separation keeps "Code smells in tests" out of the prod
# code quality gate. Frontend Vitest specs sit INSIDE sonar.sources
# (frontend/src), so they must be declared here too — otherwise Sonar treats
# them as production code that simply has no coverage data.
sonar.test.inclusions=tests/**/*.py,frontend/src/**/*.test.*,frontend/src/**/*.spec.*
sonar.test.exclusions=app/**

# Files copied INTO the image at build time aren't useful to scan twice —
# we skip the Dockerfile-mirrored paths. (Dockerfile itself IS scanned by
# the IaC analyzer.)

# --- Duplication threshold --------------------------------------------------
# Left at Sonar's default (100 lines) so genuine copy-paste is still reported;
# no threshold override is used to hide duplication.

# --- Issue handling ---------------------------------------------------------
# No project-level issue suppression is configured. Correctness, security, and
# maintainability findings must be fixed or reviewed individually in SonarQube.

# --- Quality gate ------------------------------------------------------------
# The project gate is created/refreshed by `python scripts/sonar_gate.py apply`
# (needs SONAR_TOKEN). Its conditions are:
#
#   * Coverage (overall)          at least 80%
#   * Coverage on new code        at least 80%
#   * Security rating             = A     and Vulnerabilities       = 0
#   * Security rating on new code = A     and New vulnerabilities   = 0
#   * Everything else the copied "Sonar way" carries for new code: on
#     SonarQube 10+ that is "no new issues" (new_violations = 0, stricter than
#     the per-rating conditions older servers used: new reliability and
#     maintainability rating = A) and duplicated lines on new code <= 3%
#   * "Security hotspots reviewed" is intentionally NOT a condition: hotspot
#     triage is manual work and must not block every image build. Hotspots are
#     still reported in the SonarQube UI; genuine vulnerabilities remain
#     blocked by the ratings/counts above.
#
# 80% is the same floor as `fail_under` in pyproject.toml and the coverage
# numbers shown in README.md ("Coverage policy").

# --- Quality-gate wait (CI tip, not enforced here) --------------------------
# When wiring this into CI, add `-Dsonar.qualitygate.wait=true` so the build
# fails if the gate doesn't pass. Local scans skip the wait — you can browse
# results in the SonarQube UI right after the scanner exits.
