<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#171a21" />
  <meta name="application-name" content="__APP_NAME__" />
  <meta name="application-version" content="__APP_VERSION__" />
  <meta name="application-asset-version" content="__ASSET_VERSION__" />
  <title>__APP_NAME__ — Sign in</title>
  <link rel="icon" type="image/png" href="/static/icon.png?v=__ASSET_VERSION__" />
  <!-- No inline theme script (CSP blocks it) — login/main.jsx sets data-theme before render. -->
</head>
<body class="auth-body">
  <div id="root"></div>
  <!-- Server-substituted version, kept outside #root; a backend test asserts it's in the raw HTML. -->
  <p class="auth-version" aria-label="Application version">Version __APP_VERSION__</p>
  <script type="module" src="/src/login/main.jsx"></script>
</body>
</html>
