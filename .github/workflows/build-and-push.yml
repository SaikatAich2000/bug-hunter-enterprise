# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Test policy (RUN_TESTS)
    runs-on: ubuntu-latest
    outputs:
      skip_tests: ${{ steps.policy.outputs.skip_tests }}
    steps:
      - name: Resolve RUN_TESTS
        id: policy
        env:
          RUN_TESTS_VALUE: ${{ vars.RUN_TESTS }}
        run: |
          value="$(printf '%s' "${RUN_TESTS_VALUE}" | tr '[:upper:]' '[:lower:]')"
          case "$value" in
            false|0|no|off) skip=true ;;
            *)              skip=false ;;
          esac
          echo "skip_tests=${skip}" >> "$GITHUB_OUTPUT"
          echo "RUN_TESTS='${RUN_TESTS_VALUE}' -> skip_tests=${skip}"

  lint:
    name: Lint (ruff, eslint)
    runs-on: ubuntu-latest
    needs: [policy]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install --require-hashes -r requirements-dev-lock.txt
      - run: python -m compileall -q app tests scripts
      - run: ruff check app tests scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  test:
    name: Backend tests + coverage (SQLite)
    runs-on: ubuntu-latest
    needs: [policy]
    timeout-minutes: 30
    if: ${{ needs.policy.outputs.skip_tests != 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install --require-hashes -r requirements-dev-lock.txt
      - name: Resolve APP_VERSION
        # config.py has no version fallback and .env is not checked out; an unset
        # variable falls back to a sentinel because tests only need a non-empty value.
        env:
          REPO_APP_VERSION: ${{ vars.APP_VERSION }}
        run: echo "APP_VERSION=${REPO_APP_VERSION:-0.0.0-unknown}" >> "$GITHUB_ENV"
      - name: Run tests with coverage
        env:
          CI_TEST_FORENSICS: "1"
          CI_TEST_FORENSICS_LOG: ci-forensics/pytest.log
        run: >-
          pytest -m "not ui" -n auto -q -p no:cacheprovider
          --cov=app --cov-report=xml:coverage.xml
          --junitxml=junit-parts/junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            junit-parts/*.xml
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: ci-forensics
          path: ci-forensics/*.log
          if-no-files-found: ignore
          retention-days: 7

  test-postgres:
    name: Backend tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: [policy]
    timeout-minutes: 40
    if: ${{ needs.policy.outputs.skip_tests != 'true' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      BH_TEST_DB: postgres
      BH_TEST_POSTGRES_URL: postgresql+psycopg://postgres:pw@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install --require-hashes -r requirements-dev-lock.txt
      - run: pytest -m "not ui" -n auto -q -p no:cacheprovider
        env:
          APP_VERSION: ${{ vars.APP_VERSION || '0.0.0-unknown' }}

  playwright:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: [policy]
    timeout-minutes: 30
    if: ${{ needs.policy.outputs.skip_tests != 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install --require-hashes -r requirements-dev-lock.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m ui -q -p no:cacheprovider
        env:
          APP_VERSION: ${{ vars.APP_VERSION || '0.0.0-unknown' }}

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: [policy]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        if: ${{ needs.policy.outputs.skip_tests != 'true' }}
        working-directory: frontend
      - run: npm run test:coverage
        if: ${{ needs.policy.outputs.skip_tests != 'true' }}
        working-directory: frontend
      - name: Rewrite lcov paths to be repo-root relative
        # SonarQube resolves SF: paths against the repo root, Vitest emits them relative to frontend/.
        if: ${{ needs.policy.outputs.skip_tests != 'true' }}
        run: sed -i 's#^SF:src/#SF:frontend/src/#' frontend/coverage/lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && needs.policy.outputs.skip_tests != 'true' }}
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 7
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  dependency-audit:
    name: Python dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          pip install pip-audit
          pip-audit -r requirements-lock.txt --strict

  sonar-scan:
    name: SonarQube scan
    runs-on: ubuntu-latest
    needs: [policy, lint, test, frontend-build]
    # Opt-in: needs SONAR_ENABLED=true plus the SONAR_TOKEN / SONAR_HOST_URL secrets.
    if: >-
      ${{ always() &&
        vars.SONAR_ENABLED == 'true' &&
        needs.policy.outputs.skip_tests != 'true' &&
        needs.lint.result == 'success' &&
        needs.test.result == 'success' &&
        needs.frontend-build.result == 'success'
      }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-report
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Resolve APP_VERSION
        id: app_version
        # A scan under the wrong projectVersion silently corrupts the issue-trend graph, so fail.
        env:
          REPO_APP_VERSION: ${{ vars.APP_VERSION }}
        run: |
          if [ -z "${REPO_APP_VERSION:-}" ]; then
            echo "::error::Repository variable APP_VERSION is not set"
            exit 1
          fi
          echo "version=${REPO_APP_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.projectVersion=${{ steps.app_version.outputs.version }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [policy, lint, test, test-postgres, playwright, frontend-build, dependency-audit, sonar-scan]
    # Opt-in via IMAGE_PUSH_ENABLED=true; main only. RUN_TESTS=false is the one
    # documented way the test jobs may be skipped.
    if: >-
      ${{ always() &&
        vars.IMAGE_PUSH_ENABLED == 'true' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main' &&
        needs.lint.result == 'success' &&
        needs.frontend-build.result == 'success' &&
        needs.dependency-audit.result == 'success' &&
        (
          (needs.policy.outputs.skip_tests == 'true'
            && needs.test.result == 'skipped'
            && needs.test-postgres.result == 'skipped'
            && needs.playwright.result == 'skipped'
            && needs.sonar-scan.result == 'skipped')
          ||
          (needs.policy.outputs.skip_tests != 'true'
            && needs.test.result == 'success'
            && needs.test-postgres.result == 'success'
            && needs.playwright.result == 'success'
            && (needs.sonar-scan.result == 'success'
                || (vars.SONAR_ENABLED != 'true' && needs.sonar-scan.result == 'skipped')))
        )
      }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/bug-hunter:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/bug-hunter:${{ github.sha }}
